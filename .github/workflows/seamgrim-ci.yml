name: Ddonilang Public CI Gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: seamgrim-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seamgrim-gate:
    name: seamgrim-gate
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Override the developer-machine absolute target-dir from .cargo/config.toml.
      # Keep the CI artifact path inside the checked-out repository so the
      # cache and TEUL_CLI_BIN lookup below remain portable.
      CARGO_TARGET_DIR: tools/teul-cli/target
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/teul-cli -> target

      - name: Build teul-cli
        run: cargo build --manifest-path tools/teul-cli/Cargo.toml

      - name: Export TEUL_CLI_BIN
        shell: pwsh
        run: |
          $bin = Join-Path $PWD "tools/teul-cli/target/debug/teul-cli.exe"
          if (!(Test-Path $bin)) {
            throw "teul-cli binary not found: $bin"
          }
          "TEUL_CLI_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test core
        run: cargo test --manifest-path core/Cargo.toml

      - name: Test numeric
        run: cargo test --manifest-path numeric/Cargo.toml

      - name: Test symbolic
        run: cargo test --manifest-path symbolic/Cargo.toml

      - name: Test proof
        run: cargo test --manifest-path proof/Cargo.toml

      - name: Test lang
        run: cargo test --manifest-path lang/Cargo.toml

      - name: Test tool
        run: cargo test --manifest-path tool/Cargo.toml

      - name: Test teul-cli
        run: cargo test --manifest-path tools/teul-cli/Cargo.toml

      - name: Deploy Artifacts Check
        run: python tests/run_seamgrim_deploy_artifacts_check.py

      - name: W49 Golden Index Selfcheck
        run: python tools/teul-cli/tests/run_w49_golden_index_selfcheck.py

      - name: W49 Golden
        run: python tools/teul-cli/tests/run_golden.py --root tools/teul-cli/tests/golden --teul-cli "${{ env.TEUL_CLI_BIN }}" --walk 49

      - name: W111 Golden Index Selfcheck
        run: python tools/teul-cli/tests/run_w111_golden_index_selfcheck.py

      - name: W111 Golden
        run: python tools/teul-cli/tests/run_golden.py --root tools/teul-cli/tests/golden --teul-cli "${{ env.TEUL_CLI_BIN }}" --walk 111

      - name: W109 Golden Index Selfcheck
        run: python tools/teul-cli/tests/run_w109_golden_index_selfcheck.py

      - name: W109 Golden
        run: python tools/teul-cli/tests/run_golden.py --root tools/teul-cli/tests/golden --teul-cli "${{ env.TEUL_CLI_BIN }}" --walk 109

      - name: W107 Golden Index Selfcheck
        run: python tools/teul-cli/tests/run_w107_golden_index_selfcheck.py

      - name: W107 Golden
        run: python tools/teul-cli/tests/run_golden.py --root tools/teul-cli/tests/golden --teul-cli "${{ env.TEUL_CLI_BIN }}" --walk 107

      - name: Public Language SPEC seal
        run: python tools/check_public_language_spec.py

      - name: Public first-run example
        shell: pwsh
        run: |
          & $env:TEUL_CLI_BIN run publish/examples/00_first_result.ddn
          if ($LASTEXITCODE -ne 0) {
            throw "public first-run example failed"
          }

      # tests/run_seamgrim_ci_gate.py is the internal full-product gate. It
      # depends on private docs/ssot walks, internal packs, and product/Human
      # evidence that are deliberately excluded from this public repository.
      # Run it in the Work custody environment; do not turn its OPEN results
      # into a public-main build failure or a product-closure claim.
