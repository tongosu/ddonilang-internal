# Seamgrim private-pilot reference edge profile.
# This file is an nginx http-context include: it defines log/rate zones plus
# HTTP redirect and HTTPS edge servers. TLS key material is operator-owned and
# must not be committed to the repository or image.

log_format seamgrim_private
  '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
  'status=$status bytes=$body_bytes_sent rt=$request_time ua="$http_user_agent"';

limit_req_zone $binary_remote_addr zone=seamgrim_write:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=seamgrim_conn:10m;

server {
  listen 80;
  server_name _;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name seamgrim.private.example.invalid;

  ssl_certificate /etc/nginx/secrets/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/secrets/tls/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SEAMGRIM_TLS:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  access_log /var/log/nginx/seamgrim-access.log seamgrim_private;
  error_log /var/log/nginx/seamgrim-error.log warn;

  client_max_body_size 2m;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 15s;
  send_timeout 15s;
  limit_conn seamgrim_conn 20;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  types {
    application/wasm wasm;
    application/javascript js mjs;
    text/css css;
    text/html html;
  }

  location /solutions/seamgrim_ui_mvp/ui/wasm/ {
    alias /app/solutions/seamgrim_ui_mvp/ui/wasm/;
    default_type application/wasm;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~ ^/(api/run|api/v1/projects) {
    limit_req zone=seamgrim_write burst=20 nodelay;
    proxy_pass http://ddn-exec-server:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_request_buffering on;
  }

  location / {
    proxy_pass http://ddn-exec-server:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;
  }
}
