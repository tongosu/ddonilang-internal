services:
  ddn-exec-server:
    container_name: ddn-exec-server
    build:
      context: ../../..
      dockerfile: solutions/seamgrim_ui_mvp/deploy/Dockerfile
    expose:
      - "8787"
    environment:
      SEAMGRIM_DEPLOY_PROFILE: "private-pilot"
      DDN_EXEC_SERVER_HOST: "0.0.0.0"
      DDN_EXEC_SERVER_PORT: "8787"
      SEAMGRIM_PROJECT_DATA_DIR: "/var/lib/seamgrim/project-store"
      SEAMGRIM_BUILD_DIR: "/tmp/seamgrim-build"
      SEAMGRIM_BACKUP_STAGING_DIR: "/var/backups/seamgrim/staging"
      SEAMGRIM_LOG_DIR: "/var/log/seamgrim"
      SEAMGRIM_RELEASE_COMMIT: "${SEAMGRIM_RELEASE_COMMIT:?set sealed release commit}"
      SEAMGRIM_RELEASE_MANIFEST_SHA256: "${SEAMGRIM_RELEASE_MANIFEST_SHA256:?set sealed release manifest sha256}"
      SEAMGRIM_PROJECT_STORE_SQLITE_SYNCHRONOUS: "FULL"
      SEAMGRIM_DATA_FILESYSTEM: "local"
      SEAMGRIM_SQLITE_WAL_SAFETY_ATTESTATION: "${SEAMGRIM_SQLITE_WAL_SAFETY_ATTESTATION:?set operator SQLite/WAL attestation}"
      SEAMGRIM_ALLOWED_HOSTS: "${SEAMGRIM_ALLOWED_HOSTS:?set allowed private pilot hostnames}"
      SEAMGRIM_ALLOWED_ORIGINS: "${SEAMGRIM_ALLOWED_ORIGINS:?set allowed private pilot origins}"
      SEAMGRIM_TRUSTED_PROXY_POLICY: "${SEAMGRIM_TRUSTED_PROXY_POLICY:-private-edge}"
      SEAMGRIM_PUBLIC_BASE_URL: "${SEAMGRIM_PUBLIC_BASE_URL:?set https private pilot base URL}"
      TEUL_CLI_WORKER: "${TEUL_CLI_WORKER:-0}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - type: bind
        source: ${SEAMGRIM_PROJECT_DATA_DIR:?set host project data dir}
        target: /var/lib/seamgrim/project-store
      - type: bind
        source: ${SEAMGRIM_BACKUP_STAGING_DIR:?set host backup staging dir}
        target: /var/backups/seamgrim/staging
      - type: bind
        source: ${SEAMGRIM_LOG_DIR:?set host log dir}
        target: /var/log/seamgrim
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    restart: unless-stopped
    networks:
      - seamgrim-private

networks:
  seamgrim-private:
    internal: true
